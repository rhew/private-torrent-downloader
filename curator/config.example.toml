[jackett]
base_url = "http://127.0.0.1:9117"
transmission_base_url = "http://jackett:9117"
config_dir = "../jackett-config/Jackett"

[network]
timeout = 20

[paths]
downloads_dir = "../downloads"

[transmission]
rpc_url = "http://127.0.0.1:9091/transmission/rpc"

[ui]
default_media_type = "movies"
max_results = 30
default_sort = "seeders"

[media_types.books]
label = "Books"
indexers = ["internetarchive"]
categories = [7000]
library_dir = "../library/books"

[media_types.isos]
label = "ISOs"
indexers = ["internetarchive", "linuxtracker"]
categories = [4020]
library_dir = "../library/isos"
