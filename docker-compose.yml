services:

  transmission:
    image: ${TRANSMISSION_IMAGE:-lscr.io/linuxserver/transmission}
    container_name: transmission
    environment:
      - PUID=${APP_UID:-1000}
      - PGID=${APP_GID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${TRANSMISSION_CONFIG_DIR:-./transmission-config}:/config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env}/downloads:/downloads
    network_mode: "service:gluetun"
    restart: always

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=${APP_UID:-1000}
      - PGID=${APP_GID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${JACKETT_CONFIG_DIR:-./jackett-config}:/config
    ports:
      - 9117:9117
    restart: always

  curator:
    build:
      context: .
      dockerfile: Dockerfile.curator
    container_name: curator
    environment:
      - CURATOR_JACKETT_BASE_URL=http://jackett:9117
      - CURATOR_TRANSMISSION_JACKETT_BASE_URL=http://jackett:9117
      - CURATOR_TRANSMISSION_RPC_URL=http://gluetun:9091/transmission/rpc
      - CURATOR_JACKETT_CONFIG_DIR=/app/jackett-config/Jackett
      - CURATOR_DOWNLOADS_ROOT=/app/media/downloads
      - CURATOR_LIBRARY_ROOT=/app/media/library
      - CURATOR_GLUETUN_STATE_PATH=/app/gluetun/vpngate-state.json
    volumes:
      - ./curator-config:/app/config:ro
      - ${JACKETT_CONFIG_DIR:-./jackett-config}:/app/jackett-config
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env}:/app/media
      - ./gluetun:/app/gluetun:ro
    command: ["python", "-m", "curator.server", "--config", "/app/config/curator.toml", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - ${CURATOR_PORT:-8787}:8787
    depends_on:
      - jackett
      - gluetun
      - transmission
    restart: always

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      ###### Transmission Ports
      - 9091:9091
    volumes:
      - ./gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/vpngate.ovpn
      - OPENVPN_CIPHERS=AES-256-GCM,AES-128-GCM,AES-128-CBC
      - TZ=${TZ:-America/New_York}
    restart: always

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    environment:
      - TZ=${TZ:-America/New_York}
    network_mode: host
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env}/library:/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    restart: always
