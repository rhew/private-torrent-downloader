services:

  transmission:
    image: ${TRANSMISSION_IMAGE:-lscr.io/linuxserver/transmission}
    container_name: transmission
    environment:
      - PUID=${APP_UID:-1000}
      - PGID=${APP_GID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    network_mode: "service:gluetun"
    restart: always

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=${APP_UID:-1000}
      - PGID=${APP_GID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${JACKETT_CONFIG_DIR:-./jackett-config}:/config
    ports:
      - 9117:9117
    restart: always

  curator-server:
    build:
      context: .
      dockerfile: Dockerfile.curator
    container_name: curator-server
    environment:
      - CURATOR_TOKEN=${CURATOR_TOKEN:-}
      - CURATOR_JACKETT_BASE_URL=http://jackett:9117
      - CURATOR_TRANSMISSION_JACKETT_BASE_URL=http://jackett:9117
      - CURATOR_TRANSMISSION_RPC_URL=http://gluetun:9091/transmission/rpc
      - CURATOR_JACKETT_CONFIG_DIR=/app/jackett-config/Jackett
      - CURATOR_DOWNLOADS_DIR=/app/downloads
    volumes:
      - ./curator/config.toml:/app/curator/config.toml:ro
      - ${JACKETT_CONFIG_DIR:-./jackett-config}:/app/jackett-config
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${LIBRARY_DIR:-./library}:/app/library
    ports:
      - ${CURATOR_PORT:-8787}:8787
    depends_on:
      - jackett
      - gluetun
      - transmission
    restart: always

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      ###### Transmission Ports
      - 9091:9091
    volumes:
      - ./vpngate.ovpn:/gluetun/custom.conf
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.conf
      - OPENVPN_CIPHERS=AES-256-GCM,AES-128-GCM,AES-128-CBC
    restart: always

  minidlna:
    image: vladgh/minidlna
    container_name: minidlna
    network_mode: "host"
    environment:
      - MINIDLNA_MEDIA_DIR=/media
      - MINIDLNA_FRIENDLY_NAME=${MINIDLNA_FRIENDLY_NAME:-miniDLNA}
    volumes:
      - ${LIBRARY_DIR:-./library}:/media
    restart: always
